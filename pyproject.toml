[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isis-epitope"
version = "2.0.0"
description = "B-cell epitope prediction using amino acid property scales"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "NanoSyrinx", email = "support@nanosyrinx.com" },
]
keywords = [
    "bioinformatics",
    "epitope",
    "immunology",
    "b-cell",
    "antigen",
    "prediction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "biopython>=1.80",
]
chimerax = [
    # ChimeraX dependencies are handled by ChimeraX itself
]

[project.scripts]
isis = "isis.cli:main"

[project.urls]
Homepage = "https://github.com/nanosyrinx/isis"
Documentation = "https://github.com/nanosyrinx/isis#readme"
Repository = "https://github.com/nanosyrinx/isis"
Issues = "https://github.com/nanosyrinx/isis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/isis", "src/isis_chimerax"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
